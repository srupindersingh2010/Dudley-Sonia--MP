name: Daily public information and GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # GitHub cron is UTC. The gate selects one, so UK local time stays 07:00.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
permissions:
  contents: read
concurrency:
  group: dudley-pages
  cancel-in-progress: false
jobs:
  clock:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.clock.outputs.run }}
    steps:
      - uses: actions/checkout@v6
      - id: clock
        name: Select 07:00 UK schedule
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: python3 scripts/schedule.py >> "$GITHUB_OUTPUT"
  build:
    needs: clock
    if: needs.clock.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: .cache
          key: dudley-public-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: dudley-public-v1-
      - name: Retrieve public sources independently
        run: python scripts/fetch.py
      - name: Verify retention, scheduling and parsers
        run: python -m unittest discover -s tests -v
      - name: Build complete static pages
        run: python scripts/build.py
      - name: Validate generated pages
        run: python scripts/check_site.py
      - name: Save successful snapshots and source status
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ assets/sonia-kumar.jpg
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh public information snapshots'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
